name: DuLo APK bauen

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  
# --- Nebenläufigkeit: nur ein Lauf je Branch ---
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# ------------------

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Das NNUE-Netz liegt in Git LFS und muss ausdrücklich geholt werden, sonst landet nur die Zeigerdatei im APK
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'



      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        working-directory: dulo
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: LFS-Dateien prüfen (Abbruch mit deutlicher Meldung)
        run: |
          NNUE=dulo/app/src/main/assets/nnue/nn-5af11540bbfe.nnue
          SIZE=$(stat -c%s "$NNUE")
          echo "NNUE size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::Die NNUE-Datei ist vermutlich nur ein LFS-Zeiger (${SIZE} Bytes), das APK würde ein unbrauchbares Netz enthalten"
            head -c 200 "$NNUE"
            exit 1
          fi

      - name: Run Unit Tests & Build Debug APK
        working-directory: dulo
        run: |
          ./gradlew test --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: DuLo-APK
          path: dulo/app/build/outputs/apk/debug/*.apk
          retention-days: 14
